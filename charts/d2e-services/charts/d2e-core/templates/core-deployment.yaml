apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    profile: d2e-core
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
  namespace: d2e
spec:
  replicas: 1
  selector:
    matchLabels:
      profile: d2e-core
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        profile: d2e-core
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: NotIn
                values:
                - d2e
      initContainers:
        - name: supabase-storage-pre-init
          env:
            - name: PGPORT
              value: "5432"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
          command: ["/bin/sh"]
          args:
            [
              "-c",
              "echo 'Creating role if not exists..' &&
               psql -c 'CREATE ROLE service_role NOLOGIN INHERIT;' || true &&
               echo 'Supabase Storage pre-initialization complete!' &&
               exit 0"
            ]
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
        - name: supabase-storage-grant-roles
          env:
            - name: PGPORT
              value: "5432"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: POSTGRES_CONFIG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_USER
            - name: POSTGRES_CONFIG_WRITE_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_WRITE_USER
          command: ["/bin/sh"]
          args:
            [
              '-c',
              'echo "Grant roles to users.." &&
               psql -c "GRANT service_role TO ${POSTGRES_CONFIG_ADMIN_USER};" &&
               psql -c "GRANT anon TO ${POSTGRES_CONFIG_WRITE_USER};" &&
               psql -c "GRANT authenticated TO ${POSTGRES_CONFIG_WRITE_USER};" &&
               echo "Ensure service_role can reach storage.buckets.." &&
               psql -v ON_ERROR_STOP=1 -c "SET ROLE ${POSTGRES_CONFIG_ADMIN_USER};
                 DROP POLICY IF EXISTS d2e_service_role_all ON storage.buckets;
                 CREATE POLICY d2e_service_role_all ON storage.buckets
                   FOR ALL TO service_role USING (true) WITH CHECK (true);" &&
               echo "Supabase Storage roles assignment complete!" &&
               exit 0'
            ]
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
        - name: logto-seed-init
          env:
            - name: DATABASE_CONNECTION_TIMEOUT
              value: "100000"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: IDP__JDBC__URL
          image: ghcr.io/ohdsi/d2e-logto:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            [
              "-c",
              "npm run cli db seed -- --swe && npm run cli db alteration deploy latest && node packages/core/d2e-grants.mjs",
            ]
          resources:
            {{- toYaml .Values.global.resources.logtoSeedInit | nindent 12 }}
      containers:
        # - name: etl-copy
        #   command: ["tail"]
        #   volumeMounts:
        #     - mountPath: /data
        #       name: etl-volume
        #   args:
        #     [
        #       "-f",
        #       "/dev/null"
        #     ]
        #   image: mcr.microsoft.com/azure-cli:azurelinux3.0
        #   imagePullPolicy: IfNotPresent
        #   resources:
        #     requests:
        #       cpu: 100m
        #       memory: 100Mi
        #     limits:
        #       cpu: 2
        #       memory: 16000Mi
        - name: logto
          command: ["/bin/sh"]
          args: ["-c", "npm start"]
          env:
            - name: DATABASE_CONNECTION_TIMEOUT
              value: "60000"
            - name: ADMIN_DISABLE_LOCALHOST
              value: "false"
            - name: ADMIN_ENDPOINT
              value: "http://localhost:3002"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: IDP__JDBC__URL
            - name: ENDPOINT
              value: "http://gateway.d2e.svc.cluster.local"
            - name: LOGTO_API_M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_ID
            - name: LOGTO_API_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_SECRET
            - name: LOGTO_ROLES_AZ_GROUPS_MAPPING
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_ROLES_AZ_GROUPS_MAPPING
            - name: NODE_ENV
              value: production
            - name: TLS__INTERNAL__DOMAIN
              value: alp.local
            - name: TRUST_PROXY_HEADER
              value: "true"
            - name: PORT
              value: "3001"
          image: ghcr.io/ohdsi/d2e-logto:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
          resources:
            {{- toYaml .Values.global.resources.logto | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3001
            failureThreshold: 5
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 10
          ports:
            - containerPort: 3001
              protocol: TCP
            - containerPort: 3002
              protocol: TCP
