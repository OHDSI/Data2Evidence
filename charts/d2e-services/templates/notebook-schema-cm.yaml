# Generated from services/trex/migrations/notebook -- keep in sync.
# trex migrations plugin for the `notebook` schema (studies/notebooks) and its
# PostGraphile grants; mounted into the trex container at
# /usr/src/bundled-plugins/notebook-schema. Replaces compose's notebook-migrate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-notebook-schema"
  namespace: {{ .Release.Namespace }}
data:
  package.json: |
    {
      "name": "@data2evidence/notebook-schema",
      "version": "0.0.1",
      "description": "Provisions the notebook schema (analysis_definition, analysis_result, cdm_connection, document) + PostGraphile grants",
      "trex": { "migrations": { "schema": "notebook", "database": "_config" } }
    }
  V1__notebook_schema.sql: |
    -- Notebook metadata schema.
    CREATE SCHEMA IF NOT EXISTS notebook;

    CREATE TABLE IF NOT EXISTS notebook.analysis_definition (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        TEXT NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        spec        JSONB NOT NULL,
        created_by  UUID,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at  TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_notebook_def_updated ON notebook.analysis_definition(updated_at DESC);

    CREATE TABLE IF NOT EXISTS notebook.analysis_result (
        id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        definition_id     UUID REFERENCES notebook.analysis_definition(id),
        job_id            TEXT NOT NULL,
        cdm_connection_id UUID,
        status            TEXT NOT NULL,
        storage_bucket    TEXT NOT NULL,
        storage_key       TEXT NOT NULL,
        size_bytes        BIGINT,
        created_by        UUID,
        created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_notebook_result_def ON notebook.analysis_result(definition_id);

    CREATE TABLE IF NOT EXISTS notebook.cdm_connection (
        id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        label        TEXT NOT NULL,
        dbms         TEXT NOT NULL DEFAULT 'postgresql',
        host         TEXT NOT NULL,
        port         INT  NOT NULL DEFAULT 5432,
        database     TEXT NOT NULL,
        cdm_schema   TEXT NOT NULL,
        vocab_schema TEXT,
        "user"       TEXT NOT NULL,
        password_encrypted BYTEA,
        created_by   UUID,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    -- Keep the secret out of the auto-generated GraphQL schema (RLS is bypassed).
    -- trex runs PostGraphile v5 (5.0.0-rc.7) with only the Amber + connection-filter
    -- presets — NOT the V4 preset — so the v4-era `@omit` smart tag is silently
    -- ignored (verified live: a column commented `@omit` still appears in the
    -- generated type). The v5 mechanism that actually removes a column from every
    -- generated operation/type is the behavior smart tag `@behavior -*`
    -- (verified live: `passwordEncrypted` disappears from NotebookCdmConnection).
    COMMENT ON COLUMN notebook.cdm_connection.password_encrypted IS E'@behavior -*';
  V2__notebook_document.sql: |
    -- Stored notebooks. Distinct from notebook.analysis_definition (Strategus specs):
    -- a `document` is a free-form notebook (cells + metadata) serialized into `content`.
    CREATE TABLE IF NOT EXISTS notebook.document (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        TEXT NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        content     JSONB NOT NULL,
        created_by  UUID,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        deleted_at  TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_notebook_document_updated
        ON notebook.document(updated_at DESC);
  V3__notebook_graphql_grants.sql: |
    -- Expose the `notebook` schema to PostGraphile. PostGraphile connects as the
    -- unprivileged `authenticator` role and SET ROLEs to anon/authenticated/
    -- service_role per request, so it only introspects objects those roles can see.
    -- Plugin-created schemas get no grants by default (only core/schema/
    -- V3__graphql_trexdb_grants.sql grants `trexdb`), so without this the study
    -- editor's createNotebookAnalysisDefinition mutation is absent from the GraphQL
    -- schema and saving a study fails with HTTP 400 "Cannot query field
    -- createNotebookAnalysisDefinition on type Mutation".
    --
    -- notebook.* has no RLS, so authenticated gets full table CRUD (unscoped) and
    -- service_role gets ALL. Mirrors the pattern in core/schema/V3__graphql_trexdb_grants.sql.
    -- One column IS sensitive: cdm_connection.password_encrypted holds an AES-encrypted
    -- value (useless without METADATA_ENC_KEY) and is hidden from GraphQL via its
    -- `@behavior -*` smart comment. This table-level grant still lets authenticated read
    -- those encrypted bytes over direct SQL, so treat the column as in-scope when reviewing
    -- privileges — narrow this to column-level grants if a future value must stay unreadable.

    GRANT USAGE ON SCHEMA notebook TO anon, authenticated, service_role, authenticator;

    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA notebook TO authenticated;
    GRANT USAGE ON ALL SEQUENCES IN SCHEMA notebook TO authenticated;

    GRANT ALL ON ALL TABLES IN SCHEMA notebook TO service_role;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA notebook TO service_role;

    -- Future tables/sequences in the schema inherit the same grants.
    ALTER DEFAULT PRIVILEGES IN SCHEMA notebook
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
    ALTER DEFAULT PRIVILEGES IN SCHEMA notebook
      GRANT USAGE ON SEQUENCES TO authenticated;
    ALTER DEFAULT PRIVILEGES IN SCHEMA notebook
      GRANT ALL ON TABLES TO service_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA notebook
      GRANT ALL ON SEQUENCES TO service_role;
  V4__soft_delete_columns.sql: |
    -- V4: ensure soft-delete columns exist on both notebook tables (D2).
    ALTER TABLE notebook.analysis_definition ADD COLUMN IF NOT EXISTS deleted_at timestamptz;
    ALTER TABLE notebook.analysis_definition ADD COLUMN IF NOT EXISTS created_at  timestamptz NOT NULL DEFAULT now();
    ALTER TABLE notebook.analysis_definition ADD COLUMN IF NOT EXISTS updated_at  timestamptz NOT NULL DEFAULT now();
    ALTER TABLE notebook.document            ADD COLUMN IF NOT EXISTS deleted_at timestamptz;
