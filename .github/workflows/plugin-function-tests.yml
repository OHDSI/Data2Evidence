name: Plugin Function Unit Tests

on:
  pull_request:
    paths:
      - 'plugins/functions/**'
      - 'plugins/atlas/d2e-login/**'
      - 'scripts/idp-mode-env.ts'
      - 'scripts/__tests__/idp-mode-env.test.mjs'
      - '.github/workflows/plugin-function-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'plugins/functions/**'
      - 'plugins/atlas/d2e-login/**'
      - 'scripts/idp-mode-env.ts'
      - 'scripts/__tests__/idp-mode-env.test.mjs'
      - '.github/workflows/plugin-function-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [strategus-analysis, jobplugins, dataset, _shared/idp, alp-idp-migration-init]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: ${{ matrix.plugin }} tests
        working-directory: plugins/functions/${{ matrix.plugin }}
        run: deno task test

  deno-test-idp-misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: idp-mode-env tests
        working-directory: scripts/__tests__
        run: deno test --allow-env --no-check idp-mode-env.test.mjs
      - name: d2e-login tests
        working-directory: plugins/atlas/d2e-login
        # login.test.mjs re-imports the page's scripts under a per-test query
        # string so each test runs them fresh; Deno only lets a computed
        # import through with read access. Scoped to this directory.
        run: deno test --no-check --allow-read=.
