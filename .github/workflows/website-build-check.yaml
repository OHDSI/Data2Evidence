name: Website Build Check

on:
  pull_request:
    paths:
      - 'docs/website/**'
  push:
    branches:
      - develop
    paths:
      - 'docs/website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/website/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
