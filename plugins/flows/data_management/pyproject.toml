[project]
name = "data-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.27.2",
    # Undeclared prefect 3.6.x dependency: prefect/workers/base.py imports the
    # importlib_metadata backport, which opentelemetry-api>=1.43 no longer
    # provides transitively.
    "importlib-metadata==8.7.0",
    "ibis-framework[duckdb,postgres]==10.0.0",
    "pandas==2.2.2",
    "prefect[docker,shell]==3.6.10",
    "psycopg2-binary==2.9.9",
    "pydantic==2.10.6",
    "pyjwt==2.12.0",
    "sqlalchemy==2.0.38",
]

[project.optional-dependencies]
hana = [
    "sqlalchemy-hana==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.12.7",
    "uv==0.11.6",
]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
openjdk = "17.*"

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tool.pixi.tasks]
setup-assets = "bash setup_assets.sh"

# The hana feature comes from [project.optional-dependencies]; the environment
# is provisioned at runtime only (INSTALL_SQLALCHEMY_HANA) — never shipped.
[tool.pixi.environments]
default = { solve-group = "default" }
hana = { features = ["hana"], solve-group = "default" }
