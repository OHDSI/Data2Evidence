services:
  trex:
    # No platform pin: the trexsql base and d2e-trex image are multi-arch
    # (amd64/arm64), so Docker runs/builds native to the host.
    build:
      context: ./services/trex
      dockerfile: ./Dockerfile.v2
      # GitHub Packages token for installing @ohdsi/* plugins (the Pythia agent).
      secrets:
        - github_token
      args:
        # Local builds pull published plugins from the feed; CI uses plugin-artifacts/.
        PLUGINS_FROM_REGISTRY: ${PLUGINS_FROM_REGISTRY:-@data2evidence/d2e-ui @data2evidence/d2e-functions @data2evidence/fhir @data2evidence/d2e-flows @data2evidence/i2b2-flow @data2evidence/search-embedding-flow @data2evidence/data-management-flow @data2evidence/hades-flow @data2evidence/loyalty-score-flow @data2evidence/data-transformation-flow @ohdsi/pythia-agent@0.0.1-develop.6.gc427022}
    extra_hosts:
      - "physionet-host:host-gateway"
    networks:
      alp:
        aliases:
          - ${PROJECT_NAME:-alp}-trex.${TLS__INTERNAL__DOMAIN:-alp.local}
    ports:
      - 9229:9229
      - 25432:5432
      - 25433:5433
      - 33000:33000
      - 8094:8094
    volumes:
      - trex:/usr/src/data  # Persist plugins and cache data - must match PLUGINS_PATH
      - ${D2E_FUNCTIONS:-./plugins/functions}:/usr/src/plugins/d2ef
      - ${D2E_FHIRFUNCTIONS:-./plugins/fhir_functions}:/usr/src/plugins/fhir
      - ./plugins/atlas:/usr/src/plugins/atlas  # Atlas UI plugin
      - studio-edge-functions:/app/edge-functions  # shared with the studio sidecar (LOCAL ONLY)
      # - ./plugins/chat_functions:/usr/src/plugins/chat
      # - ./plugins/ui/package.json:/usr/src/plugins/d2e-ui/package.json # For local ui development only
      # - ./plugins/ui/resources:/usr/src/plugins/d2e-ui/resources # For local ui development only
      # - ./plugins/ui/resources:/usr/src/local-resources # For CI ui build mounting
      # IMAGE-BASED TEST: no core source-mount — trex's main (now vendored into
      # services/trex/core) is bundled into the image's eszip by Dockerfile.v2.
      # - ./services/trex/deno.json:/usr/src/deno.json
      # - ./plugins/flows/base/package.json:/usr/src/plugins/d2e-flows/package.json # For local flows development only
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-full}
      LOCAL_DEBUG: "true"
      DATABASE_CREDENTIALS: ${DATABASE_CREDENTIALS:-{}}
      # Supabase Studio sidecar (LOCAL ONLY) — trex proxies /plugins/trex/studio/** to it.
      STUDIO_INTERNAL_URL: http://${PROJECT_NAME:-d2e}-studio.${TLS__INTERNAL__DOMAIN:-alp.local}:3000
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      # Bind-mounted source plugins win over bundled ones with the same package name.
      # /usr/src/plugins-dev first so trex's own web/studio/notebook plugins load too.
      PLUGINS_DEV_PATH: "/usr/src/plugins-dev:/usr/src/bundled-plugins:/usr/src/plugins"
      SQL_QUERY_TEMPLATES: '{"cohort-members": "SELECT {{COHORT_ID}} AS cohort_id, CURRENT_TIMESTAMP AS exported_at", "patient-count": "SELECT COUNT(*) AS patient_count FROM {{SCHEMA}}.person"}'
      # PhysioNet auto-provision / entitlements sync are OFF by default for local
      # dev. To exercise the flow, set USERMGMT__AUTO_PROVISION_ENABLED=true and
      # USERMGMT__ENTITLEMENTS_SYNC_ENABLED=true; the rest is pre-wired below.
      USERMGMT__AUTO_PROVISION_ENABLED: ${USERMGMT__AUTO_PROVISION_ENABLED:-false}
      USERMGMT__AUTO_PROVISION_CONNECTORS: ${USERMGMT__AUTO_PROVISION_CONNECTORS:-physionet}
      USERMGMT__AUTO_PROVISION_DEFAULT_TENANT_ID: ${USERMGMT__AUTO_PROVISION_DEFAULT_TENANT_ID:-e0348e4d-2e17-43f2-a3c6-efd752d17c23}
      USERMGMT__ENTITLEMENTS_SYNC_ENABLED: ${USERMGMT__ENTITLEMENTS_SYNC_ENABLED:-false}
      USERMGMT__ENTITLEMENTS_PHYSIONET_BASE_URL: ${USERMGMT__ENTITLEMENTS_PHYSIONET_BASE_URL:-http://physionet-host:8000}
      USERMGMT__ENTITLEMENTS_DATASET_MAPPING: '${USERMGMT__ENTITLEMENTS_DATASET_MAPPING:-{"demo":"demoeicu/1.0"}}'
      SWARM_CONFIG: |-
        {
          "cluster_id": "d2e",
          "nodes": {
            "d2e": {
              "gossip_addr": "0.0.0.0:4200",
              "extensions": [
                {
                  "name": "trexas",
                  "config": {
                    "host": "0.0.0.0",
                    "port": 33001,
                    "main_service_path": "/usr/src/core/server/index.eszip",
                    "event_worker_path": "/usr/src/core/event/index.eszip",
                    "tls_port": 33000,
                    "tls_cert_path": "/usr/src/cert/cert.pem",
                    "tls_key_path": "/usr/src/cert/key.pem",
                    "inspector": "inspect:0.0.0.0:9229"
                  }
                },
                {
                  "name": "pgwire",
                  "config": { "host": "0.0.0.0", "port": 5433, "password": "${TREX__SQL__PASSWORD:-pencil}" }
                }
              ]
            }
          }
        }
      WATCH: |-
        {
          "analytics-svc": false,
          "mri-pg-config": false,
          "fhir-gateway": false,
          "alp-dataflow-gen-init": false,
          "query-gen-svc": false,
          "alp-usermgmt": false,
          "bookmark-svc": false,
          "mri-pa-config": false,
          "cdw-svc": false,
          "jobplugins": false,
          "dataset": false,
          "alpdb": false,
          "concept-mapping": false,
          "terminology-svc": false,
          "code-suggestion": false,
          "data-mapping": false,
          "portal": false,
          "files-manager": false,
          "demo": false,
          "d2e-webapi": false,
          "perseus": false,
          "white-rabbit": false,
          "strategus-analysis": false,
          "mcp-server": false
        }

  alp-caddy:
    ports:
      - 41000:41000
      - 41130:41130
    environment:
      CADDY__FHIR_SERVER__PUBLIC_FQDN: ${CADDY__FHIR_SERVER__PUBLIC_FQDN:-localhost}
      CADDY__CORS_LOCAL_UI: "import cors"

  alp-dataflow-gen:
    ports:
      - 41120:41120
    environment:
      SYSTEM_PORTAL__API_URL: https://trex:33000/system-portal/
  alp-dataflow-gen-worker:
    build:
      context: .
      dockerfile: ./services/alp-dataflow-gen-worker/Dockerfile

  # Pixi process-worker pilot (docs/superpowers/plans/2026-07-11-pixi-process-worker-migration.md
  # Phase 0). Runs a parallel `process-pool`; production deployments keep using
  # docker-pool. Removed at cutover (Task 4.3).
  alp-dataflow-gen-worker-pixi:
    build:
      context: .
      dockerfile: ./services/alp-dataflow-gen-worker/Dockerfile
    image: d2e-dataflow-gen-worker:pixi-local
    command:
      - pixi
      - run
      - --manifest-path
      - /opt/worker/pyproject.toml
      - sh
      - -c
      - >-
        prefect work-pool create 'process-pool' --type process;
        prefect worker start --pool 'process-pool' --type process
        --name prefect-process-worker --with-healthcheck
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://${PROJECT_NAME:-d2e}-dataflow-gen-1:41120/d2e/api}
      INSTALL_SQLALCHEMY_HANA: ${INSTALL_SQLALCHEMY_HANA:-false}
      TREX_STORAGE_URL: ${TREX_STORAGE_URL:-}
      TREX_STORAGE_SERVICE_KEY: ${TREX_STORAGE_SERVICE_KEY:-}
    volumes:
      - trex:/app/duckdb_data
    networks:
      - data

  alp-logto:
    build:
      context: ./services/alp-logto
      dockerfile: Dockerfile
    extra_hosts:
      - "physionet-host:host-gateway"
    volumes:
      # Overlay the bundled connector-oidc with a d2e-patched version that
      # writes the upstream access/refresh tokens to globalThis.tokenMap so the
      # Logto JWT customizer can surface them as physionet_access_token /
      # physionet_refresh_token claims. Mirrors the connector-alp-azuread
      # override pattern below.
      - ./services/alp-logto/connector-oidc-patched/lib:/etc/logto/packages/connectors/connector-oidc/lib
      # - ./services/alp-logto/connector-alp-azuread/lib:/etc/logto/packages/connectors/connector-alp-azuread/lib

  alp-minerva-pg-mgmt-init:
    ports:
      - 9211:9211
    build:
      context: services/alp-pg-management
      dockerfile: Dockerfile
    volumes:
      - ./services/alp-pg-management/app:/home/docker/app

  alp-minerva-postgres:
    ports:
      - 41190:5432
      # - 5432:5432  # 41190 already exposes it; avoids clashing with other local stacks

  demodb:
    ports:
      - "15432:5432"

  dicom-server:
    # uses 8042 port on the container
    ports:
      - 8042:8042

  alp-logto-post-init:
    build:
      context: ./services/alp-logto/post-init
      dockerfile: Dockerfile
    # volumes:
    #   - ./services/alp-logto/post-init:/home/docker


  enterprise-gateway:
    build:
      context: ./services/enterprise-gateway
      dockerfile: Dockerfile
    environment:
      EG_ALLOW_ORIGIN: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-41100}}"
    volumes:
      - ./services/enterprise-gateway/r-strategus-lib/rD2E:/app/rD2E
      - ./services/enterprise-gateway/kernels/R_ohdsi_docker:/usr/local/share/jupyter/kernels/R_ohdsi_docker
  
  enterprise-gateway-viewer:
    build:
      context: ./services/enterprise-gateway
      dockerfile: Dockerfile
    environment:
      EG_ALLOW_ORIGIN: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-41100}}"
    volumes:
      - ./services/enterprise-gateway/r-strategus-lib/rD2E:/app/rD2E
      - ./services/enterprise-gateway/kernels/R_ohdsi_docker:/usr/local/share/jupyter/kernels/R_ohdsi_docker

  supabase-storage:
    build:
      context: ./services/supabase-storage
      dockerfile: Dockerfile

  logging:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ENABLE_SHELL=${DOZZLE_ENABLE_SHELL:-false}
      - DOZZLE_ENABLE_ACTIONS=true

  materialize-cohorts:
    profiles:
      - materialize-cohorts
    networks:
      alp:
        priority: 20
    command: npm run start
    hostname: ${PROJECT_NAME:-d2e}-materialize-cohorts
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-materialize-cohorts:${DOCKER_TAG_NAME:-develop}
    build:
      context: .
      dockerfile: ./services/materialize-cohorts/Dockerfile
    volumes:
      - services/materialize-cohorts/PKI/server.key:/app/PKI/server.key
      - services/materialize-cohorts/PKI/server.crt:/app/PKI/server.crt
      - services/materialize-cohorts/PKI/ca.crt:/app/PKI/ca.crt
    environment:
      PORT: 3333
      INSTALL_SQLALCHEMY_HANA: ${INSTALL_SQLALCHEMY_HANA:-false}
      API_MTLS_ENABLED: ${MATERIALIZE_COHORTS_API_MTLS_ENABLED:-true}
      API_TLS_KEY_PATH: ${MATERIALIZE_COHORTS_API_TLS_KEY_PATH:-/app/PKI/server.key}
      API_TLS_CERT_PATH: ${MATERIALIZE_COHORTS_API_TLS_CERT_PATH:-/app/PKI/server.crt}
      API_TLS_CA_PATH: ${MATERIALIZE_COHORTS_API_TLS_CA_PATH:-/app/PKI/ca.crt}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:3333/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  # trex studio sidecar — LOCAL ONLY (intentionally not in docker-compose.yml).
  # Internal-only: no host port. trex proxies /plugins/trex/studio/** to it and
  # enforces its own admin-only gate.
  studio:
    image: ghcr.io/ohdsi/trex-studio:latest
    container_name: ${PROJECT_NAME:-d2e}-studio
    hostname: ${PROJECT_NAME:-d2e}-studio.${TLS__INTERNAL__DOMAIN:-alp.local}
    restart: unless-stopped
    networks:
      alp:
        aliases:
          - studio
          - ${PROJECT_NAME:-d2e}-studio.${TLS__INTERNAL__DOMAIN:-alp.local}
    depends_on:
      trex:
        condition: service_healthy
    volumes:
      - studio-snippets:/app/snippets
      - studio-edge-functions:/app/edge-functions
      # The baked key-fetch reads trex.setting; d2e stores auth keys in trexdb.setting.
      - ./services/studio/fetch-trex-keys.cjs:/app/apps/studio/fetch-trex-keys.cjs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://localhost:3000/plugins/trex/studio/api/platform/profile'').then(r => { if (r.status !== 200) throw new Error(r.status) })"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      HOSTNAME: "0.0.0.0"
      # trex serves the supabase-compat surface under /trex at its internal endpoint.
      SUPABASE_URL: http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-alp.local}:33001/trex
      SUPABASE_PUBLIC_URL: https://localhost:41100/trex
      STUDIO_PG_META_URL: http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-alp.local}:33001/trex/pg/v1
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      # Fallback direct DB access — trexdb lives in the alp Postgres.
      POSTGRES_HOST: ${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}
      POSTGRES_PORT: ${PG_PORT:-5432}
      POSTGRES_DB: alp
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD}
      POSTGRES_USER_READ_WRITE: ${PG_SUPER_USER:-postgres}
      POSTGRES_USER_READ_ONLY: ${PG_SUPER_USER:-postgres}
      PGRST_DB_SCHEMAS: public,storage
      DEFAULT_ORGANIZATION_NAME: ${PROJECT_NAME:-d2e}
      DEFAULT_PROJECT_NAME: default
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions

# Studio sidecar volumes (LOCAL ONLY).
volumes:
  studio-snippets:
  studio-edge-functions:

# Build-time GitHub Packages token for installing @ohdsi/* plugins.
secrets:
  github_token:
    environment: GITHUB_TOKEN
