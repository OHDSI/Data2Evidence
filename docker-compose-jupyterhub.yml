services:
  jupyterhub:
    build:
      context: ./services/jupyterhub
    container_name: ${PROJECT_NAME:-d2e}-jupyterhub
    depends_on:
      - jupyter-poc-postgres
    env_file:
      - path: ./services/jupyterhub/.env
        required: false
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock # for docker spawner to connect docker (for vm we need to set it up rootless sotcket add?)
      LOGTO_JUPYTERHUB_CLIENT_ID: ${LOGTO__JUPYTERHUB__CLIENT_ID} # logto jupyterhub app id
      LOGTO_JUPYTERHUB_CLIENT_SECRET: ${LOGTO__JUPYTERHUB__CLIENT_SECRET} # that app's secret

      LOGTO_ALLOWED_ROLE: ${LOGTO__JUPYTERHUB__ROLE:-role.jupyteruser} # default is role.jupyteruser now

      JUPYTERHUB_OAUTH_CALLBACK_URL: ${JUPYTERHUB__PUBLIC_URL:-http://localhost:8000}/hub/oauth_callback # after logto login browser comes back to this hub

      LOGTO_AUTHORIZE_URL: https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}/oidc/auth # when you click login goes to logto login

      LOGTO_TOKEN_URL: http://${PROJECT_NAME:-d2e}-caddy:8080/oidc/token # hub changes temp code to token (hub goes into alp network caddy)

      JUPYTERHUB_HUB_CONNECT_URL: http://${PROJECT_NAME:-d2e}-jupyterhub:8081 # notebook container -> hub api

      DOCKER_NETWORK_NAME: jupyterhub-notebooks-isolated
      JUPYTERHUB_NOTEBOOK_IMAGE: ${JUPYTERHUB_NOTEBOOK_IMAGE:-d2e-jupyter-notebook:local} 
      JUPYTER_DB_ENABLED: ${JUPYTER_DB_ENABLED:-true}

      JUPYTER_DB_ADMIN_DSN: postgresql://jupyter_broker:${JUPYTER_DB_BROKER_PASSWORD:-local-poc-change-me}@jupyter-poc-postgres:5432/jupyter_poc # hub goes here when creates temp db users

      JUPYTER_DB_HOST: jupyter-poc-postgres
      JUPYTER_DB_PORT: 5432
      JUPYTER_DB_NAME: jupyter_poc
      JUPYTER_DB_SSLMODE: disable
      JUPYTER_DB_ROLE_MAP: '${JUPYTER_DB_ROLE_MAP:-{"role.jupyteruser":"jupyter_poc_reader"}}' # logto role <> psql role mapping. default to jupyteruser has jupter reader in psql
      JUPYTER_DB_LEASE_SECONDS: ${JUPYTER_DB_LEASE_SECONDS:-3600} # dfault now 1hr
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jupyterhub-data:/srv/jupyterhub/data
      # full docker access for the hub only; notebooks never get this socket
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      alp:
      jupyterhub-notebooks:
    restart: unless-stopped

  # A separate PostgreSQL
  jupyter-poc-postgres:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-d2e}-jupyter-poc-postgres
    environment:
      POSTGRES_DB: jupyter_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JUPYTER_POC_POSTGRES_PASSWORD:-local-poc-superuser-change-me}
      JUPYTER_DB_BROKER_PASSWORD: ${JUPYTER_DB_BROKER_PASSWORD:-local-poc-change-me}
    volumes:
      - jupyter-poc-postgres-data:/var/lib/postgresql/data
      - ./services/jupyterhub/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      jupyterhub-notebooks:
        aliases:
          - jupyter-poc-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jupyter_poc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  jupyterhub-data:
  jupyter-poc-postgres-data:

networks:
  alp:
  jupyterhub-notebooks:
    name: jupyterhub-notebooks-isolated
    internal: true
