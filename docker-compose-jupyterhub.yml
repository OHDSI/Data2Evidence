# Overlay, not a standalone stack. It is merged with the D2E compose file so
# that the alp network, PROJECT_NAME and the rest come from there:
#
#   docker compose -f docker-compose.yml -f docker-compose-jupyterhub.yml up -d --build
#
# Against the d2e CLI, which keeps its own compose file outside this repository,
# pass --project-directory so that the relative paths below still resolve here;
# Compose resolves them against the first -f file's directory, not this one:
#
#   d2e -c $PWD/docker-compose-jupyterhub.yml start
#   docker compose --project-directory . \
#     -f /opt/homebrew/lib/node_modules/@ohdsi/d2e/docker-compose.yml \
#     -f docker-compose-jupyterhub.yml config
#
# On a VM where D2E is remote there is no alp network to join: drop it from the
# hub's networks, point LOGTO_TOKEN_URL at the public HTTPS token endpoint, give
# the image the CA that signs it, and keep the other two networks.
services:
  # DockerSpawner needs the Docker API to create notebook containers. Mounting
  # /var/run/docker.sock into the hub would be equivalent to giving the hub root
  # on the host, so the socket is mounted here instead and this proxy exposes
  # only the endpoints DockerSpawner calls. Everything else is refused.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ${PROJECT_NAME:-d2e}-jupyterhub-socket-proxy
    environment:
      # Read access to what the spawner inspects.
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      # Write access, without which no container can be created.
      POST: 1
      # Refused. EXEC in particular would allow running arbitrary commands in
      # any container on the host.
      EXEC: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      TASKS: 0
      SERVICES: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      DISTRIBUTION: 0
      BUILD: 0
      COMMIT: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Only the hub can reach the proxy, and no ports are published.
      jupyterhub-dockerproxy:
    restart: unless-stopped

  jupyterhub:
    build:
      context: ./services/jupyterhub
    container_name: ${PROJECT_NAME:-d2e}-jupyterhub
    depends_on:
      - docker-socket-proxy
    env_file:
      # Optional, and only for tuning: the crypt key, resource limits, the
      # notebook image, logout behaviour. Everything the hub cannot start
      # without is derived below, so a default install needs no such file.
      - path: ./services/jupyterhub/.env
        required: false
    environment:
      # docker-py, and so DockerSpawner, talks to the proxy. The hub holds no
      # socket of its own.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # The OIDC client, taken from the same variables docker-compose.yml uses
      # to register the application, so the two cannot disagree.
      LOGTO_JUPYTERHUB_CLIENT_ID: ${LOGTO__JUPYTERHUB__CLIENT_ID:-jupyterhub}
      LOGTO_JUPYTERHUB_CLIENT_SECRET: ${LOGTO__JUPYTERHUB__CLIENT_SECRET:?set LOGTO__JUPYTERHUB__CLIENT_SECRET in .env, the same value the application is registered with}
      LOGTO_ALLOWED_ROLE: ${LOGTO__JUPYTERHUB__ROLE:-role.jupyteruser}
      # The callback follows the same JUPYTERHUB__PUBLIC_URL that the registered
      # redirect URI does. A mismatch between the two is the most common cause
      # of "redirect_uri mismatch", so neither is written out by hand.
      JUPYTERHUB_OAUTH_CALLBACK_URL: ${JUPYTERHUB__PUBLIC_URL:-http://localhost:8000}/hub/oauth_callback
      # Browser-facing, through caddy's TLS listener.
      LOGTO_AUTHORIZE_URL: https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}/oidc/auth
      # Server to server, through caddy's internal HTTP listener, so the hub
      # needs no local CA trust for the token exchange.
      LOGTO_TOKEN_URL: http://${PROJECT_NAME:-d2e}-caddy:8080/oidc/token
      # Notebooks reach the hub by container name.
      JUPYTERHUB_HUB_CONNECT_URL: http://${PROJECT_NAME:-d2e}-jupyterhub:8081
    ports:
      # Loopback only: on a VM the reverse proxy is the only way in.
      - "127.0.0.1:8000:8000"
    volumes:
      - jupyterhub-data:/srv/jupyterhub/data
    networks:
      # alp is needed only to reach caddy for the OIDC token exchange. Drop it
      # when D2E is on another host.
      alp:
      # Spawned notebooks live here and nowhere else, so user code cannot reach
      # Postgres, Redis, Logto's management API or anything else on alp.
      jupyterhub-notebooks:
      jupyterhub-dockerproxy:
    restart: unless-stopped

volumes:
  jupyterhub-data:

networks:
  # Declared by the D2E compose file this overlay is merged with.
  alp:
  jupyterhub-notebooks:
    # Named explicitly so DOCKER_NETWORK_NAME can refer to it.
    name: jupyterhub-notebooks
  jupyterhub-dockerproxy:
    name: jupyterhub-dockerproxy
    internal: true
