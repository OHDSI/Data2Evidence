# TYPE  DATABASE  USER          ADDRESS  METHOD
# init scripts and `docker exec psql` inside the container
local   all       all                    trust

# Logto keeps its own data in the `logto` database (it also logs in as its own per-tenant roles)
host    logto     all           all      scram-sha-256

# the PoC: only OAuth, only as jupyter_test, only with the db:jupyter_test scope.
# Logto grants that scope only to users holding the `jupyter-test` role.
host    poc       jupyter_test  all      oauth issuer="http://localhost:3001/oidc" scope="db:jupyter_test" map=logto
# same pattern for the second schema: scope db:jupyter_test_b -> role jupyter_test_b
host    poc       jupyter_test_b all     oauth issuer="http://localhost:3001/oidc" scope="db:jupyter_test_b" map=logto_b

# everything else is refused
host    all       all           all      reject
