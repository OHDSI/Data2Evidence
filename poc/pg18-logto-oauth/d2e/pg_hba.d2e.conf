# [FLOW-3 d2e] PG18 auth rules for D2E Logto (issuer http://d2e-caddy:8080/oidc): scope db:X -> may log in as role X
# Same rules as ../pg18/pg_hba.conf, with D2E Logto's issuer.
# TYPE  DATABASE  USER            ADDRESS  METHOD
local   all       all                      trust

# scope db:jupyter_test   -> role jupyter_test   (SELECT allowed.demo)
host    poc       jupyter_test    all      oauth issuer="http://d2e-caddy:8080/oidc" scope="db:jupyter_test" map=logto
# scope db:jupyter_test_b -> role jupyter_test_b (SELECT schema_b.demo)
host    poc       jupyter_test_b  all      oauth issuer="http://d2e-caddy:8080/oidc" scope="db:jupyter_test_b" map=logto_b

host    all       all             all      reject
