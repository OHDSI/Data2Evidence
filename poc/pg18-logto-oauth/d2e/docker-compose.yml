# PoC against the real D2E stack: D2E Logto <-> JupyterHub <-> PostgreSQL 18,
# three separate containers. D2E must already be running (d2e CLI).
#   sh run.sh        # sets up Logto, writes .env.d2e, then runs this file
#
# Tokens from D2E Logto carry iss=http://d2e-caddy:8080/oidc, and its discovery
# document and JWKS are served at that URL inside the d2e_alp network. So pg18 only
# needs to be on d2e_alp to verify tokens; no certificates or DNS changes.
name: pg18d2e

services:
  # the official image, unchanged; the validator and config are mounted.
  # Build the validator once: docker build --output ../validator/out ../validator
  pg18:
    image: postgres:18-alpine
    container_name: pg18d2e-pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc-superuser-change-me}
      LOGTO_DB_PASSWORD: unused-here   # the shared init script also creates a logto DB
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ident_file=/etc/postgresql/pg_ident.conf
      - -c
      - oauth_validator_libraries=pg_oidc_validator
      - -c
      - log_connections=on
    volumes:
      - pg18-data:/var/lib/postgresql
      - ../validator/out/pg_oidc_validator.so:/usr/local/lib/postgresql/pg_oidc_validator.so:ro
      - ./pg_hba.d2e.conf:/etc/postgresql/pg_hba.conf:ro
      - ../pg18/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ../pg18/init:/docker-entrypoint-initdb.d:ro
    networks:
      alp:         # to reach d2e-caddy:8080 for Logto's discovery document and JWKS
      notebooks:   # notebooks connect here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 30

  # the D2E PoC hub image and config, pointed at D2E Logto and this PostgreSQL
  jupyterhub:
    build: ../../../services/jupyterhub
    container_name: pg18d2e-jupyterhub
    depends_on:
      pg18:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      LOGTO_JUPYTERHUB_CLIENT_ID: ${POC_HUB_CLIENT_ID:-}
      LOGTO_JUPYTERHUB_CLIENT_SECRET: ${POC_HUB_CLIENT_SECRET:-}
      JUPYTERHUB_CRYPT_KEY: ${POC_HUB_CRYPT_KEY:-}
      JUPYTERHUB_OAUTH_CALLBACK_URL: http://localhost:8000/hub/oauth_callback
      # browser-facing, through D2E's Caddy
      LOGTO_AUTHORIZE_URL: https://localhost/oidc/auth
      # server to server, the same URL the token's iss names
      LOGTO_TOKEN_URL: http://d2e-caddy:8080/oidc/token
      LOGTO_RESOURCE: https://alp-default
      LOGTO_ALLOWED_ROLE: role.jupyteruser
      LOGTO_EXTRA_SCOPES: db:jupyter_test db:jupyter_test_b
      JUPYTERHUB_HUB_CONNECT_URL: http://pg18d2e-jupyterhub:8081
      DOCKER_NETWORK_NAME: pg18d2e-notebooks
      JUPYTERHUB_NOTEBOOK_IMAGE: pgoauth-notebook:local
      JUPYTER_DB_ENABLED: "false"
      JUPYTERHUB_PASS_ACCESS_TOKEN: "true"
      NOTEBOOK_PGHOST: pg18d2e-pg18
      NOTEBOOK_PGDATABASE: poc
      NOTEBOOK_PG_OAUTH_ISSUER: http://d2e-caddy:8080/oidc
      NOTEBOOK_PG_OAUTH_CLIENT_ID: ${POC_HUB_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jupyterhub-data:/srv/jupyterhub/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      alp:         # token exchange with d2e-caddy:8080
      notebooks:   # notebooks reach the hub here

volumes:
  pg18-data:
  jupyterhub-data:

networks:
  alp:
    external: true
    name: d2e_alp
  notebooks:
    name: pg18d2e-notebooks
    internal: true
