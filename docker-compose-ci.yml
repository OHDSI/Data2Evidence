services:
  trex:
    environment:
      TREX_DX_ENABLED: "false"
      # TEMPORARY. CI's public FQDN is `localhost`, which inside this container is
      # the container itself, so the token proxy and WebAPI cannot fetch the
      # issuer's endpoints over it ("error sending request for url
      # https://localhost/trex/oidc/token"). Moving the issuer to an address that
      # resolves in here fixes both, at the cost of an internal-looking `iss`.
      #
      # trex #287 adds TREX_OIDC_INTERNAL_BASE, which redirects only the
      # server-side fetches and leaves `iss` public. Once a base carrying it is
      # pinned, replace these two lines with:
      #   TREX_OIDC_INTERNAL_BASE: "http://${PROJECT_NAME:-d2e}-trex:33001"
      TREX_OIDC_ISSUER: "http://${PROJECT_NAME:-d2e}-trex:33001"
      SECURITY_AUTH_OIDC_URL: "http://${PROJECT_NAME:-d2e}-trex:33001/trex/oidc/.well-known/openid-configuration"
    volumes:
      - ./plugins/ui-built:/usr/src/plugins/d2e-ui-pr
      # Overlay the e2e-patched MRI/PA seed config onto the image-bundled
      # mri-pg-config, whose init seeds the PA config. patch-seed-for-e2e.js sets
      # the attrition chart's default attribute to monthOfBirth (Age categories
      # shift yearly and break the cohort-builder screenshot baseline). It patches
      # the checkout source, but on the trex stack the init runs from the bundled
      # copy at /usr/src/bundled-plugins/... (the `-d ./plugins/functions` checkout
      # mount is not what gets seeded), so without this overlay the unpatched
      # (Age-default) config is used. Single-file bind mount over the bundled seed.
      - ./plugins/functions/mri-pg-config/src/db/seeds/03_Config.ts:/usr/src/bundled-plugins/d2e-functions/mri-pg-config/src/db/seeds/03_Config.ts